name: Deploy to GitHub Pages

# Temporary preview host — the documented production target is Cloudflare Pages at the custom
# domain (docs/plan/02-architecture.md, docs/plan/09-deployment.md). DEPLOY_TARGET=github-pages
# switches astro.config.mjs to a /mariohossen.com base path, matching this project repo's URL
# (kirils.github.io/mariohossen.com/) — see src/lib/url.ts for how internal links respect it.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          DEPLOY_TARGET: github-pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
