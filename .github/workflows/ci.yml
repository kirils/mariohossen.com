name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Formatting, linting, the content-tooling tests, type/content-schema check, build, then
      # scripts/verify-output.mjs — output budgets and zero third-party resource requests (the
      # latter is what lets the site run with no cookie-consent banner). A malformed content
      # file fails here rather than on the live site — that guarantee is the whole reason a
      # non-technical owner can edit this repo safely. Same command as `npm run verify` locally,
      # so a green CI run is never a surprise.
      - run: npm run verify
